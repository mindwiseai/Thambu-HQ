<!doctype html><html><head><meta charset="utf-8">
<style>body{margin:0;background:#F3EFEA;width:480px;height:470px;}</style></head><body>
<svg width="480" height="470" viewBox="0 0 480 470" xmlns="http://www.w3.org/2000/svg" font-family="monospace">
  <!-- L-shaped corner road: horizontal top arm (enter from left) + vertical right arm (exit down). Inner corner = apex at (360,150). -->
  <path d="M40,60 L450,60 L450,440 L360,440 L360,150 L40,150 Z" fill="#EAE4DB" stroke="#C8C0B8" stroke-width="3"/>
  <!-- inside (apex) tight line, dashed -->
  <path d="M40,150 L330,150 Q360,150 360,180 L360,440" fill="none" stroke="#A39C94" stroke-width="2.5" stroke-dasharray="5 6"/>
  <!-- racing line: outer entry (top) -> apex (inner corner) -> outer exit (right) -->
  <path d="M40,82 C210,82 300,110 360,150 C405,178 432,250 432,440" fill="none" stroke="#C8102E" stroke-width="5" stroke-linecap="round"/>
  <!-- direction arrow on entry -->
  <path d="M150,72 l18,8 l-18,8 z" fill="#1F1B18"/>
  <!-- markers -->
  <circle cx="300" cy="104" r="6" fill="#C8102E"/><text x="296" y="98" font-size="12" fill="#1F1B18" text-anchor="end">TURN-IN</text>
  <circle cx="360" cy="150" r="7" fill="#C8102E"/><text x="376" y="146" font-size="12" fill="#1F1B18">APEX</text>
  <circle cx="432" cy="360" r="6" fill="#C8102E"/><text x="420" y="364" font-size="12" fill="#1F1B18" text-anchor="end">EXIT</text>
  <text x="46" y="50" font-size="13" font-weight="700" fill="#C8102E">OUT</text>
  <text x="392" y="130" font-size="13" font-weight="700" fill="#C8102E">IN</text>
  <text x="442" y="400" font-size="13" font-weight="700" fill="#C8102E">OUT</text>
</svg></body></html>
