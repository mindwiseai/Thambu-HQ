<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">

  <rect width="1000" height="1000" fill="#0D0D0D"/>

  <defs>
    <!--
      Mark: parallelogram 448px wide.
      Bottom x=276→724 (centre=500). Top x=312→760 (lean=36px).
      Three 48px horizontal bands = correct flag orientation.
    -->
    <clipPath id="flagClip">
      <polygon points="276,454 724,454 760,310 312,310"/>
    </clipPath>

    <!--
      Ashoka Chakra spoke template.
      Centre = (518, 382) — optical centre of mark at mid-height.
      r_hub=3.5  r_outer=19
      Spoke: from (521.5, 382) to (537, 382), rotated 24× at 15° steps.
    -->
    <line id="sp"
          x1="521.5" y1="382" x2="537" y2="382"
          stroke="#000080" stroke-width="1.6" stroke-linecap="round"/>
  </defs>

  <!-- ── MARK ── -->
  <rect x="0"    y="310" width="1000" height="48" fill="#FF9933" clip-path="url(#flagClip)"/>
  <rect x="0"    y="358" width="1000" height="48" fill="#FFFFFF"  clip-path="url(#flagClip)"/>
  <rect x="0"    y="406" width="1000" height="48" fill="#138808" clip-path="url(#flagClip)"/>

  <!-- ── ASHOKA CHAKRA (white band, cx=518 cy=382) ── -->
  <circle cx="518" cy="382" r="19"  fill="none"   stroke="#000080" stroke-width="2"/>
  <circle cx="518" cy="382" r="3.5" fill="#000080"/>
  <use href="#sp" transform="rotate(0,   518,382)"/>
  <use href="#sp" transform="rotate(15,  518,382)"/>
  <use href="#sp" transform="rotate(30,  518,382)"/>
  <use href="#sp" transform="rotate(45,  518,382)"/>
  <use href="#sp" transform="rotate(60,  518,382)"/>
  <use href="#sp" transform="rotate(75,  518,382)"/>
  <use href="#sp" transform="rotate(90,  518,382)"/>
  <use href="#sp" transform="rotate(105, 518,382)"/>
  <use href="#sp" transform="rotate(120, 518,382)"/>
  <use href="#sp" transform="rotate(135, 518,382)"/>
  <use href="#sp" transform="rotate(150, 518,382)"/>
  <use href="#sp" transform="rotate(165, 518,382)"/>
  <use href="#sp" transform="rotate(180, 518,382)"/>
  <use href="#sp" transform="rotate(195, 518,382)"/>
  <use href="#sp" transform="rotate(210, 518,382)"/>
  <use href="#sp" transform="rotate(225, 518,382)"/>
  <use href="#sp" transform="rotate(240, 518,382)"/>
  <use href="#sp" transform="rotate(255, 518,382)"/>
  <use href="#sp" transform="rotate(270, 518,382)"/>
  <use href="#sp" transform="rotate(285, 518,382)"/>
  <use href="#sp" transform="rotate(300, 518,382)"/>
  <use href="#sp" transform="rotate(315, 518,382)"/>
  <use href="#sp" transform="rotate(330, 518,382)"/>
  <use href="#sp" transform="rotate(345, 518,382)"/>

  <!-- ── WORDMARK ── -->
  <text
    x="500" y="608"
    font-family="'Arial Black', 'Impact', 'Helvetica Neue', sans-serif"
    font-size="156"
    font-weight="900"
    text-anchor="middle"
    fill="#FFFFFF"
    textLength="448"
    lengthAdjust="spacing">IERL</text>

  <!-- Tricolor divider — 448px, left-aligned to mark bottom edge (x=276) -->
  <rect x="276" y="636" width="149" height="3" fill="#FF9933"/>
  <rect x="425" y="636" width="150" height="3" fill="#FFFFFF" opacity="0.7"/>
  <rect x="575" y="636" width="149" height="3" fill="#138808"/>

  <!-- Full name — same 448px span -->
  <text
    x="500" y="678"
    font-family="'Arial', 'Helvetica Neue', Helvetica, sans-serif"
    font-size="22"
    text-anchor="middle"
    fill="#666666"
    textLength="448"
    lengthAdjust="spacing">INDIAN ESPORTS RACING LEAGUE</text>

</svg>
